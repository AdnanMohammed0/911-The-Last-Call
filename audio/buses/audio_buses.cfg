; Audio Bus Layout for 911: The Last Call
; Based on GAMEPLAY_MECHANICS §5.3, §10 and ARCHITECTURE §6
; Master bus at index 0, all others are sends

[bus_0]
name="Master"
volume_db=0.0
mute=false
solo=false
bypass_fx=false
effects=""

[bus_1]
name="Music"
volume_db=-6.0
mute=false
solo=false
bypass_fx=false
effects="Compressor,EQ"
send="Master"
send_level=0.0

[bus_2]
name="Ambience"
volume_db=-12.0
mute=false
solo=false
bypass_fx=false
effects="Reverb,EQ"
send="Master"
send_level=0.0

[bus_3]
name="Foley"
volume_db=-3.0
mute=false
solo=false
bypass_fx=false
effects="Compressor,EQ"
send="Master"
send_level=0.0

[bus_4]
name="SFX"
volume_db=0.0
mute=false
solo=false
bypass_fx=false
effects="Compressor,EQ"
send="Master"
send_level=0.0

[bus_5]
name="Phone"
volume_db=0.0
mute=false
solo=false
bypass_fx=false
effects="SpectrumAnalyzer,EQ,Distortion"
send="Master"
send_level=0.0

[bus_6]
name="VoiceProximity"
volume_db=0.0
mute=false
solo=false
bypass_fx=false
effects="EQ,Reverb"
send="Master"
send_level=0.0

[bus_7]
name="VoiceRadio"
volume_db=3.0
mute=false
solo=false
bypass_fx=false
effects="BandPass,Distortion,Compressor"
send="Master"
send_level=0.0

[bus_8]
name="Record"
volume_db=0.0
mute=true
solo=false
bypass_fx=false
effects="AudioEffectCapture"
send="Master"
send_level=0.0

[bus_9]
name="Panic"
volume_db=0.0
mute=false
solo=false
bypass_fx=false
effects="LowPassFilter,Reverb,Distortion"
send="Master"
send_level=0.0

[bus_10]
name="UI"
volume_db=-6.0
mute=false
solo=false
bypass_fx=false
effects="EQ"
send="Master"
send_level=0.0

[bus_11]
name="RadioChatter"
volume_db=-10.0
mute=false
solo=false
bypass_fx=false
effects="BandPass,Distortion,Reverb"
send="Master"
send_level=0.0

[bus_12]
name="VHS"
volume_db=0.0
mute=false
solo=false
bypass_fx=false
effects="EQ,Distortion,PitchShift"
send="Master"
send_level=0.0

; Effect configurations (to be applied in project settings or via code)
; Compressor on Music: ratio 2:1, threshold -12dB, attack 10ms, release 100ms
; Compressor on Foley: ratio 3:1, threshold -18dB, attack 5ms, release 50ms
; Compressor on SFX: ratio 4:1, threshold -10dB, attack 1ms, release 30ms
; Compressor on VoiceRadio: ratio 6:1, threshold -6dB, attack 0.5ms, release 20ms
; EQ on Phone: high-pass 300Hz, low-pass 3400Hz (telephone bandwidth)
; BandPass on VoiceRadio: 300Hz-3000Hz (radio bandwidth)
; LowPassFilter on Panic: cutoff controlled by SanitySystem (800Hz-20kHz)
; Reverb on Ambience: room size 0.8, damping 0.3, wet -15dB
; Reverb on VoiceProximity: room size 0.4, damping 0.5, wet -10dB
; Distortion on Phone: drive 0.15 (subtle line noise)
; Distortion on VoiceRadio: drive 0.3 (radio grit)
; Distortion on Panic: drive 0.2 (sanity degradation)
; PitchShift on VHS: -0.02 semitones (VHS wow/flutter simulation)