name: Auto Progress

# Safety net: if someone pushes work without updating data/progress/<id>.json,
# log it automatically under their name so the website stays accurate.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-progress
  cancel-in-progress: false

jobs:
  log:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record progress from commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/auto_progress.py
          python3 scripts/validate_progress.py
      - name: Push
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then echo "nothing to push"; exit 0; fi
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 3; done
          exit 1
